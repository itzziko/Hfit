<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hfit Architect Hub | Management Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --accent: #00f2ff;
            --danger: #ff3366;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --card-bg: rgba(15, 15, 15, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            padding: 40px 5%; 
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% -10%, rgba(0, 242, 255, 0.1) 0%, transparent 50%);
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: 1px; color: var(--accent); display: flex; align-items: center; gap: 10px;}
        h1 span { font-size: 1.2rem; background: rgba(0, 242, 255, 0.1); padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(0, 242, 255, 0.2); }
        
        .tabs {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        
        .tab {
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-dim);
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .tab:hover { background: var(--glass); color: var(--text); }
        .tab.active { background: rgba(0, 242, 255, 0.1); color: var(--accent); border-color: rgba(0, 242, 255, 0.2); }

        .controls { 
            max-width: 1200px;
            margin: 0 auto 20px;
            display: flex; 
            gap: 15px; 
            align-items: center;
        }
        .controls input {
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--glass);
            color: #fff;
            outline: none;
            width: 300px;
            font-size: 0.95rem;
        }
        .controls input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); }

        .view-content { max-width: 1200px; margin: 0 auto; display: none; }
        .view-content.active { display: block; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: rgba(0, 242, 255, 0.3); transform: translateY(-5px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        
        .meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;}
        .meta-info h3 { font-weight: 700; color: var(--accent); font-size: 1.15rem; margin-bottom: 4px; }
        .meta-info p { font-size: 0.75rem; color: var(--text-dim); }
        
        .msg-box { font-size: 0.95rem; line-height: 1.6; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; margin-bottom: 15px; flex-grow: 1; word-wrap: break-word; border: 1px solid rgba(255,255,255,0.03);}
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            transition: 0.3s;
        }
        .stat-card:hover { border-color: var(--accent); background: rgba(0, 242, 255, 0.05); }
        .stat-value { font-size: 3rem; font-weight: 900; color: var(--accent); margin-bottom: 10px; text-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .stat-label { font-size: 0.9rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }

        .user-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }
        .user-table th { text-align: left; padding: 15px; color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .user-table tr { background: var(--card-bg); border-radius: 12px; transition: 0.3s; }
        .user-table tr.me { border: 1px solid var(--accent); background: rgba(0, 242, 255, 0.05); }
        .user-table td { padding: 15px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .user-table td:first-child { border-left: 1px solid var(--border); border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        .user-table td:last-child { border-right: 1px solid var(--border); border-top-right-radius: 12px; border-bottom-right-radius: 12px; text-align: right;}
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; }
        .badge-admin { background: rgba(0, 242, 255, 0.1); color: var(--accent); border: 1px solid var(--accent); }
        .badge-user { background: rgba(255, 255, 255, 0.1); color: var(--text-dim); }

        #status { text-align: center; font-weight: 700; color: var(--accent); margin-top: 50px; font-size: 1.2rem; letter-spacing: 2px;}

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg);
            border: 1px solid var(--accent);
            padding: 30px;
            border-radius: 20px;
            width: 400px;
        }

        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-accent { background: rgba(0, 242, 255, 0.1); color: var(--accent); border: 1px solid rgba(0, 242, 255, 0.2); }
        .btn-accent:hover { background: var(--accent); color: #000; }
        .btn-danger { background: rgba(255, 51, 102, 0.1); color: var(--danger); border: 1px solid rgba(255, 51, 102, 0.2); }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card, tr, .stat-card { animation: fadeIn 0.4s ease backwards; }
    </style>
</head>
<body>
    <div class="header">
        <h1>HFIT ARCHITECT <span>PORTAL V4</span></h1>
        <div id="auth-status" style="font-size: 0.8rem; color: var(--text-dim);"></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('analytics')">ANALYTICS</div>
        <div class="tab" onclick="switchTab('feedback')">FEEDBACK</div>
        <div class="tab" onclick="switchTab('users')">USERS</div>
        <div class="tab" onclick="switchTab('bans')">BANS</div>
    </div>

    <!-- ANALYTICS VIEW -->
    <div id="view-analytics" class="view-content active">
        <div class="stats-grid">
            <div class="stat-card">
                <div id="stat-visits" class="stat-value">0</div>
                <div class="stat-label">System Visits</div>
            </div>
            <div class="stat-card">
                <div id="stat-users" class="stat-value">0</div>
                <div class="stat-label">Total Subjects</div>
            </div>
            <div class="stat-card">
                <div id="stat-feedback" class="stat-value">0</div>
                <div class="stat-label">Relay Logs</div>
            </div>
        </div>
    </div>

    <!-- FEEDBACK VIEW -->
    <div id="view-feedback" class="view-content">
        <div class="controls">
            <input type="text" id="feedbackSearch" placeholder="Search feedback..." onkeyup="filterFeedback()">
        </div>
        <div id="feedback-list" class="grid-container"></div>
    </div>

    <!-- USERS VIEW -->
    <div id="view-users" class="view-content">
        <div class="controls">
            <input type="text" id="userSearch" placeholder="Search subjects..." onkeyup="filterUsers()">
        </div>
        <table class="user-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>IP Address</th>
                    <th>Age</th>
                    <th>Joined</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="user-list"></tbody>
        </table>
    </div>

    <!-- BANS VIEW -->
    <div id="view-bans" class="view-content">
        <div class="controls" style="background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid var(--border); flex-direction: column; align-items: stretch; gap: 20px;">
            <h3 style="color: var(--accent); margin-bottom: 5px;">Establish New Restriction</h3>
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <select id="banType" style="padding: 12px; border-radius: 10px; background: var(--glass); border: 1px solid var(--border); color: #fff; outline: none; width: 120px;">
                    <option value="ip">IP Address</option>
                    <option value="email">Email</option>
                </select>
                <input type="text" id="banValue" placeholder="Target value (IP or Email)..." style="flex: 1; min-width: 250px;">
                <input type="text" id="banReason" placeholder="Reason for restriction..." style="flex: 1; min-width: 250px;">
                <button class="btn btn-danger" onclick="addBan()">EXECUTE BAN</button>
            </div>
        </div>
        
        <table class="user-table">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Target Value</th>
                    <th>Reason</th>
                    <th>Established</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ban-list"></tbody>
        </table>
    </div>

    <div id="status">INITIALIZING CORE CONNECTION...</div>



    <div id="password-modal" class="modal"><div class="modal-content">
        <h2 style="color:var(--accent); margin-bottom:20px;">Reset Password</h2>
        <p id="password-user-label" style="margin-bottom: 15px; font-size: 0.9rem; color: var(--text-dim);"></p>
        <input type="password" id="new-password" placeholder="Enter new password" style="width: 100%; padding: 12px; background: var(--glass); border: 1px solid var(--border); border-radius: 10px; color: #fff; margin-bottom: 20px;">
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn" onclick="closeModal('password-modal')">Cancel</button>
            <button class="btn btn-danger" onclick="submitPasswordReset()">Reset Password</button>
        </div>
    </div></div>

    <script>
        let globalFeedback = [];
        let globalUsers = [];
        let currentUserEmail = null;
        const token = localStorage.getItem('hfit_token');

        async function init() {
            const status = document.getElementById('status');
            if (!token) {
                status.innerHTML = "ACCESS DENIED. <br><br> Admin privileges required.";
                return;
            }
            
            try {
                const userRes = await fetch('/api/user', { headers: { 'Authorization': `Bearer ${token}` } });
                const userData = await userRes.json();
                
                if (!userData.user || !userData.user.is_admin) {
                    status.innerHTML = "UNAUTHORIZED ACCESS.";
                    return;
                }

                currentUserEmail = userData.user.email;
                document.getElementById('auth-status').textContent = `Architect: ${userData.user.username}`;
                status.style.display = 'none';
                
                refreshData();
                setInterval(refreshStats, 30000); // Auto-refresh stats
            } catch (e) { status.textContent = "CORE CONNECTION LOST."; }
        }

        async function refreshData() {
            await Promise.all([fetchFeedback(), fetchUsers(), fetchBans(), refreshStats()]);
        }

        async function refreshStats() {
            const res = await fetch('/api/stats', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.success) {
                animateValue("stat-visits", data.visits);
                animateValue("stat-users", data.users);
                animateValue("stat-feedback", data.feedback);
            }
        }

        function animateValue(id, value) {
            const el = document.getElementById(id);
            const start = parseInt(el.textContent) || 0;
            const duration = 1000;
            let startTime = null;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                el.textContent = Math.floor(progress * (value - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            }
            window.requestAnimationFrame(step);
        }

        async function fetchFeedback() {
            const res = await fetch('/feedback-logs');
            const data = await res.json();
            if (data.success) {
                globalFeedback = data.logs;
                renderFeedback(globalFeedback);
            }
        }

        async function fetchUsers() {
            const res = await fetch('/api/users', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.success) {
                globalUsers = data.users;
                renderUsers(globalUsers);
            }
        }

        function renderFeedback(logs) {
            const container = document.getElementById('feedback-list');
            container.innerHTML = logs.map((log, i) => `
                <div class="card" id="log-${log.id}" style="animation-delay: ${i * 0.05}s">
                    <div class="meta">
                        <div class="meta-info">
                            <h3>${log.name || 'Anonymous'}</h3>
                            <p style="font-weight: 700;">Time: ${new Date(log.timestamp).toLocaleString()}</p>
                        </div>
                        <span style="font-size: 0.7rem; color: var(--text-dim);">#${log.id}</span>
                    </div>
                    <div class="msg-box">${log.feedback}</div>
                    ${log.reply ? `<div style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px; font-size:0.85rem; font-style:italic; color:var(--accent);">Relay: ${log.reply}</div>` : ''}
                    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                        <button class="btn btn-danger" onclick="deleteLog(${log.id})">Dismiss / Wipe</button>
                    </div>
                </div>
            `).join('');
        }

        function renderUsers(users) {
            const container = document.getElementById('user-list');
            container.innerHTML = users.map((user, i) => `
                <tr style="animation-delay: ${i * 0.03}s" class="${user.email === currentUserEmail ? 'me' : ''}">
                    <td style="font-weight: 700;">${user.username} ${user.email === currentUserEmail ? '<span style="color:var(--accent); font-size:0.7rem;">(YOU)</span>' : ''}</td>
                    <td style="color: var(--accent);"><div style="font-weight:bold;">${user.email}</div><div style="font-size:0.7rem; color:var(--text-dim);">Pass: *[Encrypted]*</div></td>
                    <td style="font-family: monospace; font-size: 0.8rem; color: var(--text-dim);">${user.last_ip || 'N/A'}</td>
                    <td>${user.age}</td>
                    <td style="font-size:0.75rem; color:var(--text-dim);">
                        ${user.created_at ? new Date(user.created_at).toLocaleString() : 'Legacy'}
                    </td>
                    <td><span class="badge ${user.is_admin ? 'badge-admin' : 'badge-user'}">${user.is_admin ? 'ADMIN' : 'USER'}</span></td>
                    <td>
                        <div style="display:flex; flex-direction:column; gap:5px;">
                            <button class="btn btn-accent" style="padding: 5px 10px; font-size: 0.75rem;" onclick="openPasswordModal(${user.id}, '${user.email}')">Reset Pass</button>
                            <button class="btn btn-danger" style="padding: 5px 10px; font-size: 0.75rem;" onclick="deleteUser(${user.id}, '${user.email}')">Delete Acc</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`view-${tab}`).classList.add('active');
            if (tab === 'analytics') refreshStats();
            if (tab === 'bans') fetchBans();
        }

        function filterFeedback() {
            const q = document.getElementById('feedbackSearch').value.toLowerCase();
            renderFeedback(globalFeedback.filter(l => (l.name||'').toLowerCase().includes(q) || (l.feedback||'').toLowerCase().includes(q)));
        }

        function filterUsers() {
            const q = document.getElementById('userSearch').value.toLowerCase();
            renderUsers(globalUsers.filter(u => u.email.toLowerCase().includes(q) || u.username.toLowerCase().includes(q)));
        }



        let currentUserId = null;
        function openPasswordModal(id, email) {
            currentUserId = id;
            document.getElementById('password-user-label').textContent = `Target: ${email}`;
            document.getElementById('password-modal').style.display = 'flex';
        }

        async function submitPasswordReset() {
            const newPassword = document.getElementById('new-password').value;
            if (!newPassword) return;
            await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ userId: currentUserId, newPassword })
            });
            alert("Password reset.");
            closeModal('password-modal');
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        async function deleteLog(id) {
            if (confirm('Dismiss/Wipe this record?')) {
                await fetch(`/feedback/${id}`, { method: 'DELETE' });
                fetchFeedback();
            }
        }
        
        async function deleteUser(id, email) {
            if (email === currentUserEmail) {
                alert("You cannot delete your own admin account.");
                return;
            }
            if (confirm(`CRITICAL: Are you absolutely sure you want to permanently delete the user account for ${email} and all associated data?`)) {
                try {
                    const res = await fetch(`/api/users/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert("Account deleted permanently.");
                        fetchUsers();
                    } else {
                        alert("Failed to delete account.");
                    }
                } catch(e) {
                    alert("Error deleting user.");
                }
            }
        }

        async function fetchBans() {
            const res = await fetch('/api/bans', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.success) {
                renderBans(data.bans);
            }
        }

        function renderBans(bans) {
            const container = document.getElementById('ban-list');
            container.innerHTML = bans.map((ban, i) => `
                <tr style="animation-delay: ${i * 0.03}s">
                    <td style="font-weight: 800; color: var(--danger);">${ban.type.toUpperCase()}</td>
                    <td style="font-family: monospace; font-size: 0.9rem;">${ban.value}</td>
                    <td style="font-size: 0.85rem;">${ban.reason || 'No reason provided.'}</td>
                    <td style="font-size: 0.75rem; color: var(--text-dim);">${new Date(ban.created_at).toLocaleString()}</td>
                    <td>
                        <button class="btn btn-accent" style="padding: 5px 12px; font-size: 0.75rem;" onclick="removeBan(${ban.id})">Lift Restriction</button>
                    </td>
                </tr>
            `).join('');
        }

        async function addBan() {
            const type = document.getElementById('banType').value;
            const value = document.getElementById('banValue').value.trim();
            const reason = document.getElementById('banReason').value.trim();

            if (!value) {
                alert("Target value required.");
                return;
            }

            const res = await fetch('/api/bans', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ type, value, reason })
            });

            if ((await res.json()).success) {
                document.getElementById('banValue').value = '';
                document.getElementById('banReason').value = '';
                fetchBans();
                fetchUsers(); // Refresh user list if an email was banned
            }
        }

        async function removeBan(id) {
            if (confirm("Lift this restriction?")) {
                const res = await fetch(`/api/bans/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if ((await res.json()).success) {
                    fetchBans();
                    fetchUsers();
                }
            }
        }

        init();
    </script>
</body>
</html>
